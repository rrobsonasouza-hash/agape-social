name: Backup externo para Google Drive

on:
  schedule:
    - cron: "45 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agape-google-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      GOOGLE_DRIVE_RCLONE_CONFIG: ${{ secrets.GOOGLE_DRIVE_RCLONE_CONFIG }}
      BACKUP_ROOT: Agape - Backups/database

    steps:
      - name: Obter scripts do backup
        uses: actions/checkout@v5

      - name: Usar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar segredos
        run: |
          test -n "$PGPASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          test -n "$GOOGLE_DRIVE_RCLONE_CONFIG"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone ca-certificates
          install -d -m 700 "$HOME/.config/rclone"
          printf '%s' "$GOOGLE_DRIVE_RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd gdrive: >/dev/null

      - name: Gerar e criptografar backup completo
        id: backup
        run: |
          set -euo pipefail
          backup_date="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          backup_dir="$RUNNER_TEMP/agape-backup-$backup_date"
          archive="$RUNNER_TEMP/agape-supabase-$backup_date.tar.gz"
          encrypted_archive="$archive.enc"
          mkdir -p "$backup_dir"

          docker run --rm \
            -e PGPASSWORD \
            -v "$backup_dir:/backup" \
            postgres:17 \
            pg_dump \
              --host=aws-1-sa-east-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.ytjpfijdaulafnufcsni \
              --dbname=postgres \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file=/backup/database.dump
          node scripts/backup-supabase-storage.mjs "$backup_dir/storage"
          sha256sum "$backup_dir/database.dump" > "$backup_dir/SHA256SUMS"
          {
            echo "created_at_utc=$backup_date"
            echo "format=postgres-custom"
            echo "encryption=aes-256-cbc-pbkdf2"
            echo "provider=google-drive"
          } > "$backup_dir/manifest.txt"
          tar -C "$backup_dir" -czf "$archive" database.dump SHA256SUMS manifest.txt storage
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 210000 -in "$archive" -out "$encrypted_archive" -pass env:BACKUP_ENCRYPTION_PASSWORD
          echo "file=$encrypted_archive" >> "$GITHUB_OUTPUT"

      - name: Enviar ao Google Drive
        run: |
          rclone mkdir "gdrive:$BACKUP_ROOT"
          rclone copy "${{ steps.backup.outputs.file }}" "gdrive:$BACKUP_ROOT" --immutable --checksum

      - name: Reter 90 dias de cópias
        run: |
          rclone delete "gdrive:$BACKUP_ROOT" --min-age 91d
          rclone rmdirs "gdrive:$BACKUP_ROOT" --leave-root
